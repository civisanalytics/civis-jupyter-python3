name: Publish release to Docker Hub

# Publishes the "major", "major.minor", and "major.minor.micro" tags. Replaces
# Docker Hub's Automated Builds, which retires on 2027-04-01:
# https://docs.docker.com/docker-hub/repos/manage/builds/migrate/

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Every release moves the "major" and "major.minor" tags, so two releases
# publishing at once could leave "5" pointing at the older of them.
concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries no version strings of its own; they are inherited from
      # datascience-python. The change log is the only version declaration.
      - name: Check the change log version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          changelog_version="$(
            grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
              | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/' || true
          )"
          if [ -z "${changelog_version}" ]; then
            echo "::error::Found no '## [major.minor.micro]' heading in CHANGELOG.md."
            exit 1
          fi
          if [ "${tag_version}" != "${changelog_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is version ${tag_version}, but the newest released heading in CHANGELOG.md is ${changelog_version}. Move the Unreleased section under a [major.minor.micro] heading before tagging a release."
            exit 1
          fi
          echo "CHANGELOG.md ${changelog_version} matches tag ${GITHUB_REF_NAME}."

  publish:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dockerhub-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test the image
        id: build-test
        uses: ./.github/actions/build-test

      # `latest=false` is required: the default would add a `latest` tag here and
      # race latest.yaml, which owns `latest` on merges to master.
      - name: Derive the Docker Hub tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: civisanalytics/civis-jupyter-python3
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # `password` is omitted deliberately: setting it switches the action out of
      # OIDC mode and back to static credentials.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: civisanalytics

      # `provenance: false` keeps this a plain single-platform manifest. Buildx
      # otherwise attaches attestations as extra manifests inside an image index,
      # which not every client that pulls this image can handle.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            DS_PYTHON_IMG_VERSION=${{ steps.build-test.outputs.ds-python-version }}
          provenance: false
          sbom: false
