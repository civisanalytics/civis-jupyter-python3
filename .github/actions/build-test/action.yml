name: Build and test image
description: Build the image and run the smoke checks.

# A composite action rather than a reusable workflow so its steps run inside the
# caller's job, sharing one Buildx instance with the publish build that follows.
# The publish build then reuses these exact layers instead of rebuilding them.
#
# No cross-run layer cache, deliberately: every publish builds from scratch so
# the Dockerfile's apt-get install picks up whatever upstream has at that moment.

outputs:
  ds-python-version:
    description: The datascience-python base image version the image was built against.
    value: ${{ steps.base-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read the base image version
      id: base-version
      shell: bash
      run: echo "version=$(head -n 1 .ds_python_version)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build the image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        push: false
        tags: civis-jupyter-python3:test
        build-args: |
          DS_PYTHON_IMG_VERSION=${{ steps.base-version.outputs.version }}

    - name: Check the image runs
      shell: bash
      run: docker run --rm civis-jupyter-python3:test /bin/bash -c "echo BUILDS OK"

    - name: Check civis is importable
      shell: bash
      run: docker run --rm civis-jupyter-python3:test python -c "import civis"
